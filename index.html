<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B100D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F1F4EF" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Гражданское право — учебная полка. Конспекты, материалы и практика по темам курса."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Гражданское право · полка</title>
    <script>
      // до рендера, чтобы светлая тема не мигала тёмным на загрузке
      try {
        var t = localStorage.getItem("polina-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
